<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>졸음 감지 시스템</title>

    <style>
        body {
            margin: 30px;
        }

        header {
            text-align: center;
        }

        main {
            max-width: 1800px;
            margin: 30px auto;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        section {
            border: 1px solid #aaa;
            padding: 20px;
            min-width: 0;
        }

        #camera {
            width: 100%;
            display: block;
        }

        .chart-area {
            position: relative;
            height: 380px;
        }

        .result {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 15px;
        }

        th {
            width: 25%;
        }

        #count {
            font-size: 32px;
            font-weight: bold;
        }

        #wakeTime {
            display: none;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/chart.js"></script>
</head>

<body>
    <header>
        <h1>졸음 감지 시스템</h1>
        <hr>
    </header>

    <main>
        <div class="container">

            <section>
                <h2>모니터링</h2>
                <img src="/video" id="camera" alt="카메라 영상">
            </section>

            <section>
                <h2>눈 감김 점수</h2>

                <div class="chart-area">
                    <canvas id="canvas"></canvas>
                </div>

                <p>점수가 1에 가까울수록 눈 감김 정도가 높습니다.</p>
                <p>양쪽 눈의 점수가 모두 0.45 이상이면 눈을 감은 것으로 판단합니다.</p>
            </section>

        </div>

        <section class="result">
            <h2>졸음 감지 결과</h2>

            <table>
                <tr>
                    <th>누적 졸음 횟수</th>
                    <td id="count">{{ cnt }}회</td>
                </tr>

                <tr>
                    <th>상태 메시지</th>
                    <td id="message">
                        졸음 정보를 확인하고 있습니다.
                    </td>
                </tr>

                <tr id="wakeTime">
                    <th>추천 기상 시간</th>
                    <td>
                        <p id="sleepTime"></p>
                        <p id="wake1"></p>
                        <p id="wake2"></p>
                        <p>지금 잠들었을 때를 기준으로 계산한 참고 시간입니다.</p>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <script>
        // 졸음 정보 갱신
        async function updateStatus() {
            const response = await fetch("/status");

            if (!response.ok)
                return;

            const text = await response.text();
            const data = text.split(",");

            const left = data[0] == "None" ? null : Number(data[0]);
            const right = data[1] == "None" ? null : Number(data[1]);
            const cnt = Number(data[2]);

            document.getElementById("count").innerText = cnt + "회";

            let message;

            if (cnt == 0) {
                message = "아직 졸음이 감지되지 않았습니다.";
            }
            else if (cnt == 1) {
                message = "졸음이 감지되었습니다. 잠시 쉬는 걸 권장합니다.";
            }
            else if (cnt == 2) {
                message = "자주 졸고 있습니다. 휴식을 권장합니다.";
            }
            else {
                message = "하던 일을 중단하고 충분한 수면을 취하는 것을 권장합니다.";
            }

            document.getElementById("message").innerText = message;

            // 졸음 3회 이상이면 추천 기상 시간 표시
            if (cnt >= 3) {
                document.getElementById("wakeTime").style.display = "table-row";
                calculateWakeTime();
            }
            else {
                document.getElementById("wakeTime").style.display = "none";
            }

            // 그래프 갱신
            if (typeof chart !== "undefined" && chart !== null) {
                addChartData(left, right);
            }
        }

        // 추천 기상 시간 계산
        function calculateWakeTime() {
            let now = new Date();

            let wake1 = new Date(now.getTime() + 450 * 60000);
            let wake2 = new Date(now.getTime() + 540 * 60000);

            document.getElementById("sleepTime").innerText =
                "현재 시간: " + formatTime(now);

            document.getElementById("wake1").innerText =
                "7시간 30분 수면: " + formatTime(wake1);

            document.getElementById("wake2").innerText =
                "9시간 수면: " + formatTime(wake2);
        }

        // 시간 출력 형식
        function formatTime(time) {
            return time.toLocaleString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        // 최초 실행 및 1초마다 갱신
        updateStatus();
        setInterval(updateStatus, 1000);

        // 그래프 생성
        drawChart();
    </script>
</body>

</html>
