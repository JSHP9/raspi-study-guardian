<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>졸음 모니터링</title>

    <style>
        body {
            margin: 20px;
        }

        header {
            text-align: center;
        }

        .container {
            display: flex;
            max-width: 1040px;
            margin: 20px auto;
            gap: 15px;
        }

        main {
            flex: 2;
            min-width: 0;
            border: 1px solid black;
            padding: 15px;
        }

        aside {
            flex: 1;
            min-width: 0;
            border: 1px solid black;
            padding: 15px;
        }

        #camera {
            width: 100%;
            height: auto;
            display: block;
        }

        #count {
            font-size: 50px;
            text-align: center;
        }

        #wakeTime {
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>졸음 감지 시스템</h1>
        <hr>
    </header>

    <div class="container">
        <main>
            <h3>모니터링</h3>
            <img src="/video" id="camera">
        </main>

        <aside>
            <section>
                <h3>누적 졸음 횟수</h3>
                <p id="count">{{ cnt }}회</p>
            </section>

            <hr>

            <section>
                <h3>상태 메시지</h3>
                <p id="message">졸음 정보를 확인하고 있습니다.</p>
            </section>

            <section id="wakeTime">
                <hr>
                <h3>램 수면 계산</h3>

                <p id="sleepTime"></p>
                <p id="wake1"></p>
                <p id="wake2"></p>

                <p>
                    지금 잠들었을 때를 기준으로 계산한 시간
                </p>
            </section>
        </aside>
    </div>

    <script>
        // 졸음 횟수 및 상태 메시지 갱신
        async function updateStatus() {
            const response = await fetch("/status");

            if (!response.ok)
                return;

            const cnt = Number(await response.text());

            document.getElementById("count").innerText = cnt + "회";

            let message;

            if (cnt == 0) {
                message = "아직 졸음이 감지되지 않았습니다.";
            }
            else if (cnt == 1) {
                message = "졸음이 감지되었습니다. 잠시 쉬는걸 권장합니다.";
            }
            else if (cnt == 2) {
                message = "졸음이 반복되고 있습니다. 휴식을 권장합니다.";
            }
            else {
                message = "하던 일을 중단하고 충분한 수면을 취하는 것을 권장합니다.";
            }

            document.getElementById("message").innerText = message;

            // 졸음 3회 이상이면 예상 기상 시간 표시
            if (cnt >= 3) {
                document.getElementById("wakeTime").style.display = "block";
                calculateWakeTime();
            }
            else {
                document.getElementById("wakeTime").style.display = "none";
            }
        }

        // 예상 기상 시간 계산
        function calculateWakeTime() {
            let now = new Date();

            // 90분 수면 주기 5회, 6회
            let wake1 = new Date(now.getTime() + 450 * 60000);
            let wake2 = new Date(now.getTime() + 540 * 60000);

            document.getElementById("sleepTime").innerText =
                "현재 시간: " + formatTime(now);

            document.getElementById("wake1").innerText =
                "7시간 30분 수면: " + formatTime(wake1);

            document.getElementById("wake2").innerText =
                "9시간 수면: " + formatTime(wake2);
        }

        // 날짜 및 시간 출력 형식
        function formatTime(time) {
            return time.toLocaleString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        // 최초 실행 및 1초마다 갱신
        updateStatus();
        setInterval(updateStatus, 1000);
    </script>
</body>

</html>
